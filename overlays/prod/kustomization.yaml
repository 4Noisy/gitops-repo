apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/4noisy/scoring-api
    newTag: "24ccc15e9badccbd1d3343c2a8bb9ab29f65f4c5"   # se fija por PR revisado (2 revisores)
patches:
  - target:
      kind: ConfigMap
      name: scoring-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: prod
