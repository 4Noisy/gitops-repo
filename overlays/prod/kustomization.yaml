apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/4noisy/scoring-api
    newTag: "0a881bb26c9432242039f94b8e331d9809637e60"   # se fija por PR revisado (2 revisores)
patches:
  - target:
      kind: ConfigMap
      name: scoring-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: prod
