apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/4noisy/scoring-api
    newTag: "8ef551b25ac848e848d9d15d2847b0882d9f1065"   # se fija por PR revisado (2 revisores)
patches:
  - target:
      kind: ConfigMap
      name: scoring-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: prod
