apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/4noisy/scoring-api
    newTag: latest

patches:
  # Elimina el Ingress en desarrollo
  # porque el cluster local no utiliza ingress-nginx
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: scoring-api
        namespace: crediscore
