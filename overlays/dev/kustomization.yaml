apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/4noisy/scoring-api
    newTag: "24ccc15e9badccbd1d3343c2a8bb9ab29f65f4c5"

patches:
  # Cluster local sin ingress controller: se quita el Ingress.
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: scoring-api
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: scoring-api
      $patch: delete
  # Cluster local sin metrics-server: sin esto Argo CD marca el HPA como Degraded.
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: scoring-api
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: scoring-api
      $patch: delete
