apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/4noisy/scoring-api
    newTag: latest

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: scoring-api
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: scoring-api
      $patch: delete
