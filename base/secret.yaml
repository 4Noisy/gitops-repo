# src/main.py todavía NO lee ningún secreto (storage en memoria, sin validar el token
# OAuth2 del contrato todavía). Se deja el Secret listo para cuando se conecte a Aurora
# PostgreSQL (ADR 0004) y se agregue envFrom al Deployment con esa clave — así el equipo
# no tiene que re-aprender el patrón ConfigMap/Secret en ese momento.
# PLACEHOLDER — no commitear valores reales (ADR 0003: secretos en AWS Secrets Manager).
# En stg/prod se reemplaza por un ExternalSecret sincronizado desde Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: scoring-secrets
  namespace: crediscore
  labels:
    app.kubernetes.io/name: scoring-api
    app.kubernetes.io/part-of: crediscore
    iniciativa: crediscore
type: Opaque
stringData:
  DATABASE_URL: "postgresql://scoring:CHANGE_ME@localhost:5432/crediscore?sslmode=require"
