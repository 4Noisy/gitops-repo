# Deployment de scoring-api a partir del Dockerfile real del repo:
# build python:3.11-slim -> runtime gcr.io/distroless/python3-debian12:nonroot,
# ENTRYPOINT ["python3", "-m", "src.main"], EXPOSE 8080, USER nonroot (UID 65532).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring-api
  namespace: crediscore
  labels:
    app.kubernetes.io/name: scoring-api
    app.kubernetes.io/part-of: crediscore
    app.kubernetes.io/component: scoring
    app.kubernetes.io/version: "0.1.0"
    iniciativa: crediscore
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: scoring-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scoring-api
        app.kubernetes.io/part-of: crediscore
        app.kubernetes.io/component: scoring
        iniciativa: crediscore
    spec:
      serviceAccountName: scoring-api
      automountServiceAccountToken: false
      # Margen sobre el graceful shutdown de uvicorn
      # (timeout_graceful_shutdown=25 hardcodeado en src/main.py).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # UID/GID del usuario "nonroot" de gcr.io/distroless/*:nonroot.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: scoring-api
      containers:
        - name: api
          # El tag lo fija el overlay (kustomize images) con el SHA del commit.
          image: ghcr.io/4noisy/scoring-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: scoring-config
            - secretRef:
                name: scoring-secrets
                # El Secret aún no tiene claves que el código lea (ver comentario en
                # secret.yaml); optional evita que el Pod falle si se borra temprano.
                optional: true
          resources:
            # Estimación inicial (sin benchmark todavía): FastAPI + storage en memoria,
            # sin modelo de ML real cargado. Ajustar con `kubectl top` en el mini-lab.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          # Sin preStop: la imagen runtime es distroless (sin /bin/sh, sin binario
          # `sleep`), así que un lifecycle.preStop.exec fallaría en cada rollout/scale-down.
          # terminationGracePeriodSeconds + el graceful shutdown de uvicorn (25s) bastan.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
