apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scoring-api-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/4Noisy/gitops-repo.git
    targetRevision: main
    path: overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: crediscore

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
